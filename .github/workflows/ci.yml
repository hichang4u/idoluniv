name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Next 16 requires >= 20.9
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # 빌드는 실제 Supabase 에 접속하지 않는다(데이터 페이지는 요청 시 렌더).
      # 더미 값으로 환경변수 누락에 의한 빌드 실패만 막는다.
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
          NEXT_TELEMETRY_DISABLED: "1"
